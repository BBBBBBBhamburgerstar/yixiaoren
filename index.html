<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F6FA">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>衣小人原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fredoka:wght@500;600&display=swap" media="print" onload="this.media='all'">
<script src="three.min.js"></script>
<style>
/* 布局：左侧原型导览 + 居中的 iPhone 画框；≤520px 时 App 直接铺满屏幕 */
:root{
  --bg:#E8E6EE; --app:#F7F6FA; --card:#FFFFFF; --tile:#F0EEF4;
  --ink:#24202C; --ink2:#5D5768; --mute:#9690A1; --line:#E4E1EA;
  --accent:#EC5A8A; --accent-2:#C93D6F; --accent-soft:#FCE4EC; --on-accent:#FFFFFF;
  --mint:#D6F0E5; --mint-ink:#1F6F53; --butter:#FFF0C4; --butter-ink:#7E5A06; --danger:#D23F4D;
  --frame:#1C1A21; --shadow:0 1px 2px rgba(36,32,44,.05),0 6px 18px rgba(36,32,44,.06);
  --f-display:"Fredoka","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-body:"PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0E13; --app:#17151C; --card:#221F29; --tile:#2A2732;
  --ink:#F2EFF6; --ink2:#C4BECE; --mute:#8B8596; --line:#34303D;
  --accent:#FF79A3; --accent-2:#FF9BBB; --accent-soft:#3F1F2C; --on-accent:#2A0D19;
  --mint:#173A2E; --mint-ink:#8BDDBB; --butter:#3A3120; --butter-ink:#F1CF77; --danger:#FF6B77;
  --frame:#000; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0E13; --app:#17151C; --card:#221F29; --tile:#2A2732;
  --ink:#F2EFF6; --ink2:#C4BECE; --mute:#8B8596; --line:#34303D;
  --accent:#FF79A3; --accent-2:#FF9BBB; --accent-soft:#3F1F2C; --on-accent:#2A0D19;
  --mint:#173A2E; --mint-ink:#8BDDBB; --butter:#3A3120; --butter-ink:#F1CF77; --danger:#FF6B77;
  --frame:#000; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}

/* 外框 */
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:24px;padding-inline:16px}
.side{width:270px;flex:none;display:flex;flex-direction:column;gap:18px}
.side .brand{font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:-.01em}
.side .brand small{display:block;font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--mute);letter-spacing:.04em;margin-top:2px}
.side p{color:var(--ink2);line-height:1.6;margin:0}
.pnav{display:flex;flex-direction:column;gap:2px}
.pnav button{display:flex;gap:10px;align-items:baseline;text-align:left;padding:7px 10px;border-radius:10px;color:var(--ink2)}
.pnav button:hover{background:var(--card)}
.pnav button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.pnav .no{font-family:var(--f-mono);font-size:11px;color:var(--mute);width:20px;flex:none}
.pnav .grp{font-size:11px;color:var(--mute);letter-spacing:.1em;padding:10px 10px 4px}
.note{background:var(--butter);color:var(--butter-ink);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.6}
.note b{display:block;margin-bottom:2px}
.note ul{margin:0;padding-left:16px}

.phone{position:relative;width:390px;height:min(844px,calc(100vh - 48px));min-height:620px;background:var(--app);border-radius:54px;
  box-shadow:0 0 0 11px var(--frame),0 0 0 12px #44414d,0 40px 80px -24px rgba(30,20,50,.45);overflow:hidden;display:flex;flex-direction:column;flex:none}
.sbar{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 30px 0 36px;font-family:var(--f-display);font-weight:600;font-size:15px;position:relative}
.sbar .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000}
.sbar .ic{display:flex;gap:5px;align-items:center}
.viewport{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 28px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px 28px;background:var(--app);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);padding-top:2px}
.tabbar button.on{color:var(--accent);font-weight:600}
@media (max-width:900px){.side{display:none}}
@media (max-width:520px){
  .wrap{padding:0;display:block;height:100%}
  .phone{width:100%;height:100%;min-height:0;border-radius:0;box-shadow:none}
  .sbar{display:none}
  .tabbar{padding-bottom:10px}
}

/* 头部 */
.hdr{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;margin:0 -16px;padding:10px 16px 12px;background:var(--app)}
.hdr h2{flex:1;margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sp{width:38px;flex:none}
.ibtn{width:38px;height:38px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);color:var(--ink)}
.tbtn{height:38px;padding:0 14px;border-radius:13px;background:var(--accent);color:var(--on-accent);font-weight:600;flex:none}
.tblock{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 0 14px}
.eyebrow{font-size:12px;color:var(--mute);letter-spacing:.12em}
h1.big{margin:2px 0 0;font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
h1.big .num{font-variant-numeric:tabular-nums}

/* 通用 */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;height:32px;padding:0 14px;border-radius:16px;background:var(--card);font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--ink);color:var(--app);box-shadow:none}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.6}
.chip.addocc{color:var(--accent-2);border:1.5px dashed var(--accent);box-shadow:none;background:none}
.chip.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:14px;background:var(--card);padding:0 12px;box-shadow:var(--shadow);color:var(--mute);margin-bottom:12px}
.search input{flex:1;min-width:0;border:0;background:none;height:100%;font-size:15px;outline:none;color:var(--ink)}
.search button{color:var(--ink2);display:flex;align-items:center;gap:4px;font-size:13px}
.search button.act{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.card{background:var(--card);border-radius:20px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.thumb{aspect-ratio:1;border-radius:14px;background:var(--tile);display:grid;place-items:center;overflow:hidden;position:relative}
.thumb>svg,.thumb>img{width:80%;height:80%;object-fit:contain}
.meta{padding:0 4px 4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.code{font-family:var(--f-mono);font-size:11.5px;color:var(--accent-2);letter-spacing:.02em}
.name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mute)}
.badge{position:absolute;top:8px;left:8px;font-family:var(--f-mono);font-size:10.5px;background:var(--card);color:var(--ink2);padding:2px 7px;border-radius:8px}
.empty{padding:40px 12px;text-align:center;color:var(--mute);line-height:1.7}
.fab{position:absolute;right:18px;bottom:18px;z-index:8;height:54px;padding:0 20px 0 16px;border-radius:27px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;box-shadow:0 12px 24px -10px var(--accent);transition:transform .25s ease,opacity .25s ease}
.fab.away{transform:translateY(96px);opacity:0;pointer-events:none}
.btn{height:48px;border-radius:16px;padding:0 18px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.btn.pri{background:var(--accent);color:var(--on-accent);box-shadow:0 10px 22px -12px var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent-2);box-shadow:none}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{height:38px;font-size:13px;border-radius:12px;padding:0 12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px}
.row>.btn{flex:1;min-width:0}
.sec{background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);margin-top:12px}
.sec h3{margin:0;font-size:15px;font-weight:600}
.fl{display:flex;flex-direction:column;gap:8px;min-width:0}
.lab{font-size:12px;color:var(--mute);letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px}
.lab a,.lab button{color:var(--accent-2);font-size:12px}
.inp{height:44px;border-radius:12px;background:var(--tile);border:0;padding:0 12px;width:100%;font-size:15px;outline:none}
.inp:focus{box-shadow:inset 0 0 0 2px var(--accent)}
textarea.inp{height:76px;padding:10px 12px;resize:none;line-height:1.5}
.inp.mono{font-family:var(--f-mono);letter-spacing:.04em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--tile);border-radius:14px;padding:4px;gap:4px}
.seg button{height:34px;border-radius:10px;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.aibox{background:var(--mint);color:var(--mint-ink);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.tip{background:var(--butter);color:var(--butter-ink);border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.6}
.err{color:var(--danger);font-size:13px}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.kv div:first-child{border-top:0}
.kv span{color:var(--mute);flex:none}
.kv b{font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}
.hero-thumb{aspect-ratio:1;border-radius:26px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);margin-top:4px}
.hero-thumb>svg,.hero-thumb>img{width:72%;height:72%;object-fit:contain}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--tile);border-radius:12px;padding:10px 12px}
.codebox .code{font-size:18px}
.codebox .rk{font-size:12px;color:var(--mute);text-align:right;line-height:1.4}
.meta .cl{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.rank{font-family:var(--f-mono);font-size:10.5px;color:var(--mute)}
.bigcode{font-family:var(--f-mono);font-size:22px;color:var(--accent-2);margin-top:16px;letter-spacing:.03em}
.ititle{font-size:22px;font-weight:600;margin:2px 0 8px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.hscroll::-webkit-scrollbar{display:none}

/* 今天 */
/* 今天页铺满一屏：小人区域自动伸缩，单品和三个按钮始终在屏幕内 */
.screen.fitmode{padding-bottom:14px}
.today{min-height:100%;display:flex;flex-direction:column}
.drawcard{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:12px;flex:1;min-height:0;display:flex;flex-direction:column}
.drawcard .fig{position:relative;flex:1;min-height:150px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#FDE4EE,#F1ECFF)}
.drawcard .fig svg{position:absolute;top:0;bottom:0;left:0;right:0;margin:auto;height:100%;width:auto;max-width:100%}
.drawcard .fig .figmode{z-index:1}
@media (max-height:800px){.today .tblock{padding:8px 0 10px}.today .drawcard{margin-top:10px!important}.today .drawcard>.lab{display:none}.swaprow{margin-top:10px}.swit{width:58px}.swit .thumb{width:58px}.swit .nm{display:none}.a3i{width:44px;height:44px}.a3.main .a3i{width:56px;height:56px}.a3.main .a3i svg{width:24px;height:24px}.a3{gap:4px;font-size:12px}.act3{margin-top:10px}.weekstrip .wd .th{display:none}}
.swaprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:8px -12px 0;padding:2px 12px 4px}
.swaprow::-webkit-scrollbar{display:none}
.swit{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.swit .thumb{width:74px;border-radius:14px}
.swit .nm{font-size:11.5px;color:var(--ink2);width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swit.add .thumb{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--accent-2);font-size:24px}
.act3{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;margin-top:16px;flex:none}
.a3{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.a3i{width:52px;height:52px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.a3.main{color:var(--accent-2);font-weight:600}
.a3.main .a3i{width:72px;height:72px;background:var(--accent);color:var(--on-accent);box-shadow:0 12px 24px -10px var(--accent)}
.a3.main .a3i svg{width:30px;height:30px}
.a3.done{color:var(--mint-ink)}
.a3.done .a3i{background:var(--mint);color:var(--mint-ink);box-shadow:none}
.figmode{position:absolute;left:8px;top:8px;font-size:11.5px;font-weight:600;background:var(--card);color:var(--ink2);padding:4px 9px;border-radius:10px;box-shadow:var(--shadow)}
.btn.done{background:var(--mint);color:var(--mint-ink);box-shadow:none;cursor:default}
.card.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.card[disabled]{opacity:.35;pointer-events:none}
.flipin{animation:flipin .55s cubic-bezier(.2,.8,.2,1)}
@keyframes flipin{from{transform:perspective(900px) rotateY(-100deg) scale(.95);opacity:.2}}
.donebadge{margin-top:10px;display:flex;gap:6px;align-items:center;justify-content:center;background:var(--mint);color:var(--mint-ink);border-radius:12px;padding:9px;font-size:12.5px}
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 3px 8px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:11px;color:var(--mute);position:relative}
.wd b{font-family:var(--f-display);font-size:15px;color:var(--ink);font-weight:600}
.wd .th{width:100%;aspect-ratio:1;border-radius:8px;background:var(--tile);display:grid;place-items:center;margin-top:2px}
.wd .th>svg,.wd .th>img{width:82%;height:82%;object-fit:contain}
.wd.on{background:var(--ink);color:var(--app)}
.wd.on b{color:var(--app)}
.wd .ok{position:absolute;top:-4px;right:-3px;width:16px;height:16px;border-radius:50%;background:var(--mint-ink);color:var(--card);display:grid;place-items:center}
.wd .ok svg{width:10px;height:10px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
.weeknav>div{text-align:center}
.weeknav b{display:block;font-size:15px}
.weeknav span{font-size:12px;color:var(--mute)}
.weeknav .ibtn{box-shadow:none;background:var(--tile)}
.days{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.dayrow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.dayrow.today{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.dmain{flex:1;display:flex;align-items:center;gap:10px;min-width:0;text-align:left}
.dl{width:44px;flex:none;text-align:center}
.dl b{display:block;font-size:14px}
.dl span{font-size:11px;color:var(--mute);font-family:var(--f-mono)}
.dth{flex:1;display:flex;gap:6px;min-width:0;overflow:hidden;align-items:center}
.dth .thumb{width:42px;flex:none;border-radius:10px}
.st{font-size:11px;color:var(--mint-ink);display:flex;align-items:center;gap:2px;flex:none}

/* 对话 · 小衣 */
.chathdr{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;margin:0 -16px;padding:10px 16px 10px;background:var(--app);border-bottom:1px solid var(--line)}
.chathdr .who{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.chathdr .who b{display:block;font-size:16px}
.chathdr .who small{font-size:11.5px;color:var(--mute)}
.botav{width:34px;height:34px;border-radius:12px;background:linear-gradient(140deg,var(--accent),#F7A3C0);color:#fff;display:grid;place-items:center;flex:none}
.botav svg{width:19px;height:19px}
.tbr{display:flex;align-items:center;gap:8px;flex:none}
.meav{width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--accent-soft);box-shadow:0 0 0 2px var(--card),var(--shadow);flex:none}
.meav svg{width:100%;height:100%;display:block}
.pastbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--butter);color:var(--butter-ink);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:12.5px}
.pastbar button{font-weight:600;color:var(--butter-ink);text-decoration:underline}
.msgs{display:flex;flex-direction:column;gap:10px;padding:12px 0 8px}
.tsep{align-self:center;font-size:11px;color:var(--mute);font-family:var(--f-mono);padding:4px 0}
.mrow{display:flex;gap:8px;align-items:flex-start;max-width:100%}
.mrow.me{justify-content:flex-end}
.mrow .botav{width:30px;height:30px;border-radius:10px}
.mcol{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:80%}
.mrow.me .mcol{align-items:flex-end}
.bub{padding:10px 13px;border-radius:18px;font-size:14.5px;line-height:1.55;background:var(--card);box-shadow:var(--shadow);border-top-left-radius:6px;overflow-wrap:anywhere;white-space:pre-wrap}
.mrow.me .bub{background:var(--accent);color:var(--on-accent);border-top-left-radius:18px;border-top-right-radius:6px;box-shadow:none}
.bub.voice{display:flex;align-items:center;gap:6px;min-width:84px;justify-content:flex-end;font-family:var(--f-mono);font-size:13px}

/* 标签输入 */

/* 抽屉、提示 */
.sheet{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(20,14,30,.38);animation:fade .2s}

.sheet-title{font-size:17px;font-weight:600;margin-bottom:4px}
.sheet-sub{color:var(--mute);font-size:13px;margin-bottom:14px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px}

.opt small{color:var(--mute);font-size:12.5px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--app);padding:10px 16px;border-radius:14px;font-size:13.5px;max-width:88%;text-align:center;animation:drop .25s;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes drop{from{transform:translate(-50%,-12px);opacity:0}}

/* 抠图 */
.checker{background:conic-gradient(var(--tile) 25%,var(--card) 0 50%,var(--tile) 0 75%,var(--card) 0) 0 0/22px 22px}
.cutstage{position:relative;aspect-ratio:1;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);display:grid;place-items:center}
.cutstage canvas,.cutstage img{width:100%;height:100%;object-fit:contain;display:block;touch-action:none}
.scan{position:absolute;inset:0;background:rgba(255,255,255,.28);display:grid;place-items:end center;padding-bottom:16px;font-size:13px;font-weight:600;color:#3a2c40}
.scan::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent);box-shadow:0 0 18px 2px var(--accent);animation:scan 1.3s ease-in-out infinite alternate}
.scan span{background:rgba(255,255,255,.85);padding:6px 12px;border-radius:12px}
@keyframes scan{to{top:calc(100% - 3px)}}

/* 搭配 */
.stage{position:relative;width:min(100%,300px);margin:4px auto 0;aspect-ratio:3/4;border-radius:24px;background:radial-gradient(var(--line) 1.1px,transparent 1.4px) 0 0/16px 16px,var(--card);box-shadow:var(--shadow);overflow:hidden}
.piece{position:absolute;transform:translate(-50%,-50%);touch-action:none;cursor:grab;border-radius:10px}

.piece.sel{outline:2px dashed var(--accent);outline-offset:2px}
.stage-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:13px;padding:24px;text-align:center}
.tools{display:flex;justify-content:center;gap:8px;margin-top:12px;min-height:38px;align-items:center}
.tools .hint{color:var(--mute);font-size:12.5px}
.mini{position:relative;aspect-ratio:3/4;border-radius:14px;background:var(--tile);overflow:hidden}
.mini .piece{pointer-events:none;cursor:default}
.drawer .ditems{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 4px}

.ditem{flex:none;width:76px;display:flex;flex-direction:column;gap:4px;align-items:center}

.ditem .ck{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}

/* 3D 与形象 */

.t3.sm{height:290px}

.t3 .hint3{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;color:var(--ink2);background:var(--card);padding:5px 10px;border-radius:10px;display:flex;gap:5px;align-items:center;white-space:nowrap;pointer-events:none;opacity:.9}
.segmini .seg{padding:3px;border-radius:12px}
.segmini .seg button{height:30px;padding:0 12px;font-size:13px;border-radius:9px}

.bstats b{display:block;font-family:var(--f-display);font-size:16px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.t3fail{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);padding:20px;text-align:center}
.statchips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.statchips span{background:var(--card);border-radius:12px;padding:8px 6px;font-size:11px;color:var(--mute);box-shadow:var(--shadow);text-align:center;white-space:nowrap}
.statchips b{display:block;font-family:var(--f-display);font-size:17px;color:var(--ink);font-weight:600}
.sl{display:flex;flex-direction:column;gap:6px}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.sl-v{color:var(--mute);font-size:12px}
.sl-v b{font-family:var(--f-display);font-size:18px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.bmi{font-size:12.5px;color:var(--mute)}
.result{border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.result svg{display:block;width:100%;height:auto}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:10px;align-items:center;color:var(--mute)}
.steps li.on{color:var(--ink);font-weight:600}
.steps li.ok{color:var(--mint-ink)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:rot .8s linear infinite;flex:none}
.dotc{width:18px;height:18px;border-radius:50%;background:var(--tile);flex:none;display:grid;place-items:center}
@keyframes rot{to{transform:rotate(360deg)}}

/* 我的 */
.profile{display:flex;align-items:center;gap:14px;padding:14px 0 6px}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.stat{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .br{display:grid;grid-template-columns:36px 1fr 28px;gap:10px;align-items:center;font-size:13px}
.bars .tr{height:8px;border-radius:4px;background:var(--tile);overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bars .br em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--mute);text-align:right}
.menu{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden}
.mi{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;border-top:1px solid var(--line)}
.mi:first-child{border-top:0}

.toprow .meta{flex:1;padding:0}

/* 引导 */
.onb{min-height:100%;display:flex;flex-direction:column;padding-top:18px;gap:16px}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}

function readImage(file) {

}

  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
  r /= n; g /= n; b /= n;

AFTER.cutout = p => {
  const cv = $('#cutcv'), ctx = cv.getContext('2d');
  Promise.all([loadImg(p.orig), loadImg(p.cut)]).then(([o, c]) => {
    p._o = o; cv.width = c.naturalWidth; cv.height = c.naturalHeight;
    if (p._data) ctx.putImageData(p._data, 0, 0); else ctx.drawImage(c, 0, 0);
    if (!p.processed) setTimeout(() => { p.processed = true; const s = $('#scan'); if (s) s.hidden = true; }, 1400);
  });
  let last = null;
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  const dab = ([x, y]) => {
    const rad = p.brush * cv.width / 300;
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
    if (p.tool === 'erase') { ctx.globalCompositeOperation = 'destination-out'; ctx.fill(); }
    else if (p._o) { ctx.clip(); ctx.drawImage(p._o, 0, 0, cv.width, cv.height); }
    ctx.restore();
  };
  const stroke = e => { const q = pt(e); if (last) { const n = Math.ceil(Math.hypot(q[0] - last[0], q[1] - last[1]) / 4); for (let i = 1; i <= n; i++) dab([last[0] + (q[0] - last[0]) * i / n, last[1] + (q[1] - last[1]) * i / n]); } else dab(q); last = q; };
  cv.addEventListener('pointerdown', e => { if (!p.processed) return; cv.setPointerCapture(e.pointerId); last = null; stroke(e); });
  cv.addEventListener('pointermove', e => { if (last) stroke(e); });
  const end = () => { if (last) p._data = ctx.getImageData(0, 0, cv.width, cv.height); last = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
};

/* AI 试穿（Demo：用 2D 插画示意生成结果） */
let gidN = 0;
function figureSVG(pieces, mode, body, look, opt = {}) {
  const Q = mode === 'q', cx = 100;
  const its = pieces.map(p => ({ p, it: itemById(p.iid) })).filter(x => x.it).sort((a, b) => a.p.z - b.p.z);
  const bmi = bmiOf(body);
  const wf = clamp(0.5 * (body.hip / 89) + 0.2 * (body.bust / 83) + 0.3 * Math.pow(bmi / 18.8, 0.7), 0.8, 1.5);
  const wwf = clamp(body.waist / 64, 0.8, 1.6);
  const hs = Q ? 1 : clamp(body.h / 163, 0.9, 1.12);
  const G = Q ? { hy: 118, hr: 58, sh: 172, wa: 222, hi: 250, le: 352, sw: 31, lx: 15, arm: 80, lw: 26, aw: 18 }
    : { hy: 388 - 334 * hs, hr: 21, sh: 388 - 302 * hs, wa: 388 - 238 * hs, hi: 388 - 198 * hs, le: 388, sw: 30, lx: 12, arm: 124 * hs, lw: 17, aw: 11 };
  const Sh = G.sw * wf, Wa = G.sw * 0.74 * wf * Math.sqrt(wwf), Hp = G.sw * 0.98 * wf;
  const skin = look.skin, hc = look.hairColor, R = G.hr;
  const nest = (it, x, y, w, h, flip) => {
    const inner = it.img ? `<image href="${it.img}" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>` : artInner(it.sub, it.color);
    const sv = `<svg x="${flip ? 0 : x}" y="${flip ? 0 : y}" width="${w}" height="${h}" viewBox="0 0 100 100" preserveAspectRatio="none" overflow="visible">${inner}</svg>`;
    return flip ? `<g transform="translate(${x + w} ${y}) scale(-1 1)">${sv}</g>` : sv;
  };
  const gid = 'fg' + (++gidN);
  const BG = [['#FDE4EE', '#F1ECFF'], ['#E2F4EB', '#F7F1E4'], ['#E4EDFB', '#FCEFF4']][(opt.bg || 0) % 3];
  let s = '';
  if (opt.bg !== false) s += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${BG[0]}"/><stop offset="1" stop-color="${BG[1]}"/></linearGradient></defs><rect width="200" height="420" fill="url(#${gid})"/><ellipse cx="100" cy="${G.le + 8}" rx="${Q ? 62 : 50}" ry="8" fill="#3a2a40" opacity=".08"/>`;
  if (look.hair === 'long') s += `<path d="M${cx - R * 1.05} ${G.hy} Q${cx - R * 1.2} ${G.hy + R * (Q ? 1.15 : 2.9)} ${cx} ${G.hy + R * (Q ? 1.25 : 3)} Q${cx + R * 1.2} ${G.hy + R * (Q ? 1.15 : 2.9)} ${cx + R * 1.05} ${G.hy} Z" fill="${hc}"/>`;
  if (look.hair === 'pony') s += `<ellipse cx="${cx + R * 0.98}" cy="${G.hy + R * 0.25}" rx="${R * 0.32}" ry="${R * (Q ? 0.75 : 1.35)}" fill="${hc}"/>`;
  [-1, 1].forEach(g => { s += `<path d="M${cx + g * (Sh - 2)} ${G.sh + 6} L${cx + g * (Sh + (Q ? 10 : 8))} ${G.sh + G.arm}" stroke="${skin}" stroke-width="${G.aw * Math.sqrt(wf)}" stroke-linecap="round"/>`; });
  [-1, 1].forEach(g => { s += `<path d="M${cx + g * Hp * 0.5} ${G.hi - 10} L${cx + g * G.lx * wf} ${G.le - 6}" stroke="${skin}" stroke-width="${G.lw * Math.sqrt(wf)}" stroke-linecap="round"/>`; });
  const torso = `M${cx - Sh} ${G.sh} Q${cx - Sh} ${G.sh - 8} ${cx - 8} ${G.sh - 8} L${cx + 8} ${G.sh - 8} Q${cx + Sh} ${G.sh - 8} ${cx + Sh} ${G.sh} Q${cx + Wa + 3} ${(G.sh + G.wa) / 2} ${cx + Wa} ${G.wa} Q${cx + Hp + 2} ${(G.wa + G.hi) / 2} ${cx + Hp} ${G.hi} L${cx - Hp} ${G.hi} Q${cx - Hp - 2} ${(G.wa + G.hi) / 2} ${cx - Wa} ${G.wa} Q${cx - Wa - 3} ${(G.sh + G.wa) / 2} ${cx - Sh} ${G.sh} Z`;
  const has = c => its.some(x => x.it.cat === c);
  s += `<path d="${torso}" fill="${has('top') ? skin : '#E9E3F1'}"/>`;
  if (!has('bottom')) s += `<path d="M${cx - Hp} ${G.wa + 8} L${cx + Hp} ${G.wa + 8} L${cx + Hp + 2} ${G.hi + 16} L${cx + 2} ${G.hi + 16} L${cx} ${G.hi} L${cx - 2} ${G.hi + 16} L${cx - Hp - 2} ${G.hi + 16} Z" fill="#6B6480"/>`;
  s += `<rect x="${cx - R * 0.32}" y="${G.hy + R * 0.7}" width="${R * 0.64}" height="${G.sh - G.hy - R * 0.7}" fill="${skin}"/>`;
  const RATIO = { 'T恤': .40, '衬衫': .44, '卫衣': .44, '针织': .44, '外套': .46 };
  its.filter(x => x.it.cat === 'bottom').forEach(({ it }) => {
    const hipW = 2 * Hp, low = G.wa + (G.hi - G.wa) * 0.2;
    if (it.sub === '半身裙') { const w = 2 * Wa / 0.32 * 1.05, h = Q ? 118 : 190; s += nest(it, cx - w / 2, G.wa - 0.12 * h, w, h); }
    else if (it.sub === '短裤') { const w = hipW / 0.44, h = Q ? 100 : 160; s += nest(it, cx - w / 2, low - 0.16 * h, w, h); }
    else { const ratio = it.sub === '西裤' ? .36 : .40, w = hipW / ratio * 1.02, h = (G.le - low + 4) / 0.84; s += nest(it, cx - w / 2, low - 0.10 * h, w, h); }
  });
  its.filter(x => x.it.cat === 'top').forEach(({ it }) => {
    const long = it.sub === '外套', w = 2 * Sh / (RATIO[it.sub] || .44) * 0.86, h = ((G.hi - G.sh) + (long ? (Q ? 26 : 44) : (Q ? 8 : 14))) / 0.76;

function cnNum(str) {
  const m = String(str).match(/[零一二两三四五六七八九十百千]+/); if (!m) return null;
  const D = { 零: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 }, U = { 十: 10, 百: 100, 千: 1000 };
  let total = 0, n = 0;
  for (const c of m[0]) { if (c in D) n = D[c]; else { total += (n || 1) * U[c]; n = 0; } }
  return total + n || null;
}

const REC = {};
function demoUtter() {
  const f = activeFlow();

function recStart(done, demo) {
  Object.assign(REC, { t0: Date.now(), text: '', rec: null, done, demo });
  const v = $('#vrec'); v.hidden = false;
  v.innerHTML = `<div class="wave">${'<i></i>'.repeat(9)}</div><div class="vt" id="vt">正在听…</div><small>松开发送</small>`;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  try {
    const r = new SR(); r.lang = 'zh-CN'; r.interimResults = true; r.continuous = true;
    r.onresult = e => { REC.text = Array.from(e.results).map(x => x[0].transcript).join(''); const vt = $('#vt'); if (vt) vt.textContent = REC.text; };
    r.onerror = () => { REC.rec = null; };
    r.start(); REC.rec = r;
  } catch (e) { REC.rec = null; }
}
function recStop(ok) {
  const dur = Math.round((Date.now() - REC.t0) / 1000);

    $('#vrec').hidden = true;
    if (!ok) return;
    if (Date.now() - REC.t0 < 500) return toast('按住麦克风说话，说完再松开');

    if (REC.done) return REC.done(text, Math.max(1, dur), !real);

}

    const fl = new THREE.DirectionalLight(0xffe6f0, 0.3); fl.position.set(-2, 1, -1.5); scene.add(fl);
    const sh = new THREE.Mesh(new THREE.CircleGeometry(0.34, 40), new THREE.MeshBasicMaterial({ color: 0x3a2a40, transparent: true, opacity: 0.1 }));
    sh.rotation.x = -Math.PI / 2; sh.position.y = 0.002; scene.add(sh);

    el.addEventListener('pointermove', e => { if (!T3.drag) return; grp.rotation.y += (e.clientX - T3.drag.x) * 0.012; T3.drag.x = e.clientX; });

}

let t3pending = null;

const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0 });

function mesh(g, geo, m, pos, scale) { const x = new THREE.Mesh(geo, m); if (pos) x.position.set(...pos); if (scale) x.scale.set(...scale); g.add(x); return x; }
function addHair(g, look, cy, r, sy, q) {

  if (look.hair === 'long') mesh(g, new THREE.SphereGeometry(r, 24, 16), m(), [0, cy - r * (q ? 0.3 : 0.95), -r * 0.42], [1.0, q ? 1.0 : 1.9, 0.55]);

    mesh(g, new THREE.SphereGeometry(r * 0.3, 16, 12), m(), [0, cy + r * 0.3, -r * 1.02]);
    const t = mesh(g, new THREE.CapsuleGeometry(r * 0.2, r * (q ? 0.7 : 1.3), 6, 12), m(), [0, cy - r * (q ? 0.25 : 0.5), -r * 1.15]); t.rotation.x = 0.28;

function buildReal(g, b, look) {
  const H = b.h / 100, k = H / 1.65, bmi = bmiOf(b), bf = clamp(Math.sqrt(bmi / 20.5), 0.8, 1.35), E = Math.PI * 1.75;
  const hipA = b.hip / 100 / E, waA = b.waist / 100 / E, buA = b.bust / 100 / E;

    const ag = lathe([[armR * 0.55, -L], [armR * 0.7, -0.78 * L], [armR * 0.82, -0.52 * L], [armR, -0.3 * L], [armR * 1.05, -0.08 * L], [armR * 0.8, 0.01], [0.01, 0.03 * L]], 24);

    const lg = lathe([[anR, 0.045 * H], [caR * 0.8, 0.13 * H], [caR, 0.2 * H], [knR, 0.28 * H], [thR * 0.8, 0.36 * H], [thR, y0 - 0.02 * H], [thR * 0.8, y0 + 0.03 * H]], 28);

SCREENS.onboard = p => {
  p.b = p.b || { ...S.body }; const st = p.step || 0;
  const dots = `<div style="display:flex;align-items:center"><div class="dots">${[0, 1, 2].map(i => `<i class="${i === st ? 'on' : ''}"></i>`).join('')}</div>${st < 2 ? '<button class="skip" data-act="onbSkip">跳过</button>' : ''}</div>`;
  if (st === 0) return `<div class="onb">${dots}<div class="onb-fig">${figureSVG(S.outfits[1] ? S.outfits[1].pieces : [], 'q', S.body, S.look, { bg: 0, vb: '10 20 180 360' })}</div>
    <h1>把衣柜装进口袋，<br>再捏一个小小的你</h1><p>拍照就能入库，按你的编号整理；等比的你和 Q 版的你，都能换上自己的衣服。</p><div class="grow"></div>
    <button class="btn pri block" data-act="onbNext">开始</button></div>`;
  if (st === 1) return `<div class="onb">${dots}<h1 style="font-size:24px">先告诉我你的身材</h1><p>用来生成和你等比例的小人，只保存在你的手机里，之后随时可以改。</p>
    ${t3host('sm')}<div class="sec" style="margin-top:0">${slidersHTML(p.b)}</div><button class="btn pri block" data-act="onbNext">生成我的小人</button></div>`;
  return `<div class="onb">${dots}<h1 style="font-size:24px">你的小人做好啦</h1><p>切换看看两种样子。穿上自己的衣服，要在搭配里点「AI 试穿」。</p>
    ${seg('mode', [['real', '等比'], ['q', 'Q 版']], UI.mode)}${t3host()}<button class="btn pri block" data-act="onbDone">看看今天穿什么</button></div>`;
};
AFTER.onboard = p => { if ((p.step || 0) >= 1) t3mount($('#t3'), p.b, S.look, UI.mode); };
ACT.onbNext = () => { const p = cur().p; if (p.step === 1) { S.body = { ...p.b }; save(); } p.step = (p.step || 0) + 1; render(); };
ACT.onbSkip = () => { S.onboarded = true; save(); tabTo('today'); };
ACT.onbDone = () => { S.onboarded = true; save(); toast('欢迎！先看看今天穿什么'); tabTo('today'); };

/* ---------- 原型页面导航 ---------- */
const PAGES = [['首次打开', [['0', 'onboard', '首次引导']]],
  ['今天', [['14', 'today', '今天穿什么'], ['15', 'week', '本周排期']]],
  ['衣柜', [['1', 'wardrobe', '衣柜首页'], ['2', 'add', '添加方式'], ['2b', 'taobao', '淘宝导入'], ['3', 'cutout', '抠图确认'], ['4', 'itemForm', '单品信息'], ['5', 'item', '单品详情'], ['6', 'rules', '编号规则']]],
  ['搭配', [['7', 'outfits', '搭配列表'], ['8', 'outfitEdit', '搭配画布'], ['9', 'tryon', 'AI 试穿']]],
  ['对话', [['16', 'chat', '对话 · 小衣'], ['18', 'chatCal', '聊天记录日历']]],

  ['我的', [['13', 'me', '我的 · 形象'], ['11', 'body', '身材编辑'], ['12', 'look', '外观设置']]]];
const pagesHTML = () => PAGES.map(([g, list]) => `<div class="grp">${g}</div>` + list.map(([no, k, n]) => `<button data-act="jump" data-k="${k}"><span class="no">${no}</span>${n}</button>`).join('')).join('');
function markNav() { const n = cur().n; document.querySelectorAll('#pnav [data-k]').forEach(b => b.classList.toggle('on', b.dataset.k === n)); }
ACT.pagesSheet = () => openSheet(`<div class="sheet-title">原型页面导航</div><div class="sheet-sub">直接跳到任意一页</div><nav class="pnav">${pagesHTML()}</nav>`);
ACT.jump = async el => {
  const k = el.dataset.k; closeSheet();
  const o0 = S.outfits[0], i0 = S.items[0];
  if (k === 'add') { tabTo('wardrobe'); openSheet(addSheet()); return; }
  if (k === 'cutout') { const r = await makeSample(); NAV = [{ n: 'wardrobe', p: {} }, { n: 'cutout', p: r }]; }
  else if (k === 'itemForm') NAV = [{ n: 'wardrobe', p: {} }, { n: 'itemForm', p: { d: newDraft({ cat: 'top', sub: '衬衫', colorName: '浅蓝', name: '浅蓝色衬衫' }) } }];
  else if (k === 'item') NAV = [{ n: 'wardrobe', p: {} }, { n: 'item', p: { id: i0 && i0.id } }];
  else if (k === 'taobao') NAV = [{ n: 'wardrobe', p: {} }, { n: 'taobao', p: {} }];
  else if (k === 'rules') NAV = [{ n: 'today', p: {} }, { n: 'me', p: {} }, { n: 'rules', p: {} }];
  else if (k === 'me') NAV = [{ n: 'today', p: {} }, { n: 'me', p: {} }];
  else if (k === 'outfitEdit') NAV = [{ n: 'outfits', p: {} }, { n: 'outfitEdit', p: { d: o0 ? clone(o0) : { name: '', occasions: [], pieces: [] }, sel: -1 } }];
  else if (k === 'tryon') NAV = [{ n: 'outfits', p: {} }, { n: 'tryon', p: { pieces: o0 ? clone(o0.pieces) : [] } }];
  else if (k === 'week') NAV = [{ n: 'today', p: {} }, { n: 'week', p: {} }];
  else if (k === 'body' || k === 'look') NAV = [{ n: 'today', p: {} }, { n: 'me', p: {} }, { n: k, p: {} }];
  else if (k === 'chatCal') { NAV = [{ n: 'chat', p: {} }]; render(); return ACT.chatCal(); }
  else if (k === 'onboard') NAV = [{ n: 'onboard', p: { step: 0 } }];
  else NAV = [{ n: k, p: {} }];
  render();
};

/* ---------- 事件 ---------- */
ACT.back = back;
ACT.tab = el => tabTo(el.dataset.tab);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const f = ACT[el.dataset.act];
  if (f) f(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind) { const d = cur().p.d; d[el.dataset.bind] = el.value; }
  if (el.dataset.inp && INP[el.dataset.inp]) INP[el.dataset.inp](el, e);
});

/* ---------- 启动 ---------- */
$('#tabbar').innerHTML = [['wardrobe', I.hanger, '衣柜'], ['outfits', I.shirt, '搭配'], ['today', I.sun, '今天'], ['chat', I.chat, '对话']].map(([k, ic, n]) => `<button data-act="tab" data-tab="${k}">${ic}<span>${n}</span></button>`).join('');
$('#pnav').innerHTML = pagesHTML();
// 往下滑时收起右下角按钮，避免挡住卡片；往上滑或滑到底再出现
(() => { const sc = $('#screen'), fab = $('#fab'); let last = 0;
  sc.addEventListener('scroll', () => {
    const st = sc.scrollTop, atEnd = st + sc.clientHeight >= sc.scrollHeight - 4;
    if (atEnd || st < 40 || st < last - 4) fab.classList.remove('away');
    else if (st > last + 4) fab.classList.add('away');
    last = st;
  }, { passive: true });
})();
loadState();
NAV = S.onboarded ? [{ n: 'today', p: {} }] : [{ n: 'onboard', p: { step: 0 } }];
render();
</script>

</body>
</html>
